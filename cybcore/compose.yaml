name: cybcore

services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cybcore:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/cybcore
      CYBCORE_BIND: 0.0.0.0:8080
      CYBCORE_STATUS_TOKEN: ${CYBCORE_STATUS_TOKEN:?Set CYBCORE_STATUS_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybcore
      POSTGRES_USER: cybcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybcore -d cybcore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    networks: [backend]

networks:
  backend:
    name: cybcore
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
