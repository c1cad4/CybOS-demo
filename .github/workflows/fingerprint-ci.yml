name: CybChat fingerprint CI

on:
  push:
    branches: [fix/cryptographic-peer-fingerprints]
  pull_request:
    branches: [main, fix/secure-peer-key-persistence]

concurrency:
  group: cybchat-fingerprint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check
      - name: Cargo tests
        run: cargo test
      - name: Whitespace check
        run: git diff --check
