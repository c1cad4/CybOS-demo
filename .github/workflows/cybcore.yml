name: CybCore checks
on:
  pull_request:
  push:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cybcore_test
          POSTGRES_USER: cybcore
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cybcore -d cybcore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://cybcore:ci-test-only@localhost:5432/cybcore_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format server
        working-directory: cybcore/server
        run: cargo fmt --all
      - name: Check server
        working-directory: cybcore/server
        run: cargo check --all-targets
      - name: Tests
        working-directory: cybcore/server
        run: cargo test --all-targets
