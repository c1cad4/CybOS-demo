name: CybChat listener startup CI

on:
  push:
    branches: [fix/secure-listener-startup-errors]
  pull_request:
    branches: [main, feat/secure-peer-trust-approval-sha256]

concurrency:
  group: cybchat-listener-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check
      - name: Cargo tests
        run: cargo test
      - name: Whitespace check
        run: git diff --check
