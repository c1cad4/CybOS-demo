name: cybOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cybOS-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --locked

      - name: Build debug binary for process harness
        run: cargo build --locked --bin cybos

      - name: Headless onion smoke test
        run: CYBOS_HEADLESS_ONION_TEST=1 target/debug/cybos

      - name: Cargo test
        run: cargo test --locked -- --test-threads=1

      - name: Diff whitespace check
        run: git diff --check

  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --locked

      - name: Build debug binary for process harness
        run: cargo build --locked --bin cybos

      - name: Headless onion smoke test
        run: CYBOS_HEADLESS_ONION_TEST=1 target/debug/cybos

      - name: Cargo test
        run: cargo test --locked -- --test-threads=1

      - name: macOS release build
        run: cargo build --release --locked

      - name: Diff whitespace check
        run: git diff --check
