name: cybOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cybOS-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --locked

      - name: Build debug binary for process harness
        run: cargo build --locked --bin cybos

      - name: Headless onion smoke test
        run: CYBOS_HEADLESS_ONION_TEST=1 target/debug/cybos
      - name: Process-isolated onion crash recovery
        run: CYBOS_HEADLESS_ONION_PROCESS_TEST=1 target/debug/cybos
        timeout-minutes: 2

      - name: Cargo test
        run: cargo test --locked -- --test-threads=1

      - name: Diff whitespace check
        run: git diff --check

  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --locked

      - name: Build debug binary for process harness
        run: cargo build --locked --bin cybos

      - name: Headless onion smoke test
        run: CYBOS_HEADLESS_ONION_TEST=1 target/debug/cybos

      - name: Process-isolated onion crash recovery
        run: CYBOS_HEADLESS_ONION_PROCESS_TEST=1 target/debug/cybos
        timeout-minutes: 2

      - name: Cargo test
        run: cargo test --locked -- --test-threads=1

      - name: macOS release build
        run: cargo build --release --locked

      - name: Package macOS app
        run: |
          rm -rf cybOS.app cybOS-macos-test.zip
          mkdir -p cybOS.app/Contents/MacOS cybOS.app/Contents/Resources
          cp target/release/cybos cybOS.app/Contents/MacOS/cybOS
          cat > cybOS.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>cybOS</string>
          <key>CFBundleDisplayName</key><string>cybOS — CicadaFarm + RobotCYB</string>
          <key>CFBundleIdentifier</key><string>to.cicada.cybos</string>
          <key>CFBundleVersion</key><string>0.7.0</string>
          <key>CFBundleShortVersionString</key><string>0.7.0</string>
          <key>CFBundleExecutable</key><string>cybOS</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          chmod +x cybOS.app/Contents/MacOS/cybOS
          codesign --force --deep --sign - cybOS.app
          ditto -c -k --sequesterRsrc --keepParent cybOS.app cybOS-macos-test.zip

      - name: Upload macOS test app
        uses: actions/upload-artifact@v4
        with:
          name: cybOS-macos-test
          path: cybOS-macos-test.zip
          if-no-files-found: error

      - name: Diff whitespace check
        run: git diff --check
