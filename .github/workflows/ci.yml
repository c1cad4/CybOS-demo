name: cybOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check

      - name: Cargo test
        run: cargo test

      - name: Diff whitespace check
        run: git diff --check

  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check

      - name: Cargo test
        run: cargo test

      - name: macOS release build
        run: cargo build --release

      - name: Compile CoreBluetooth advertiser
        run: swiftc macos/CybOSBLEAdvertiser.swift -o /tmp/cybOS-ble-advertiser -framework CoreBluetooth

      - name: Diff whitespace check
        run: git diff --check
