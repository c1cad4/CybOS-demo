<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020603" />
    <meta name="description" content="cybOS — local-first cybernetic operating system interface prototype" />
    <title>cybOS // Cybernetic Operating System</title>
    <link rel="stylesheet" type="text/css" href="style.css" />

    <!-- Visual runtime. p5 is used only as the prototype renderer. -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/addons/p5.sound.min.js"></script>
  </head>
  <body>
    <main id="cybos-root" aria-label="cybOS interface"></main>

    <button id="cyb-runtime-status"
            type="button"
            aria-label="Open cybOS runtime status"
            title="Runtime status — press R">
      RUNTIME BOOT
    </button>

    <aside id="cyb-runtime-panel"
           aria-label="cybOS runtime cells"
           aria-live="polite"></aside>

    <script src="sketch.js"></script>
    <script src="runtime.js"></script>
    <script src="runtime-bridge.js"></script>

    <script>
      document.getElementById("cyb-runtime-status").addEventListener("click", () => {
        window.CYB_RUNTIME?.togglePanel();
      });
    </script>
  </body>
</html>
