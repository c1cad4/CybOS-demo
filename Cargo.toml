[package]
name = "cybos"
version = "0.7.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
snow = "0.10.0"
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
corebluetooth = "0.1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[package.metadata.bundle]
name = "cybOS"
identifier = "to.cicada.cybos"
icon = []
version = "0.7.0"
short_description = "CicadaFarm + RobotCYB + CybChat native desktop OS"
long_description = "Native local-first cybOS combining RobotCYB, CicadaFarm, CybChat, Brain, Knowledge Graph and Assets."
