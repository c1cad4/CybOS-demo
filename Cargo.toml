[package]
name = "cybos"
version = "0.7.2"
edition = "2024"

[features]
default = []
hardware-serial = ["dep:serialport"]
hardware-rpi = ["dep:rppal", "dep:embedded-hal"]
oracle-switchboard = ["dep:switchboard-on-demand"]

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
uuid = { version = "1", features = ["v4", "serde"] }
snow = "0.10.0"
ureq = { version = "3", features = ["json"] }
librqbit = "9.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

serialport = { version = "4", optional = true }
embedded-hal = { version = "1", optional = true }
rppal = { version = "0.22.1", optional = true }
switchboard-on-demand = { version = "0.10", default-features = false, features = ["client", "solana-v2"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
corebluetooth = "0.1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[package.metadata.bundle]
name = "cybOS"
identifier = "to.cicada.cybos"
icon = []
version = "0.7.2"
short_description = "CicadaFarm + RobotCYB + CybChat native desktop OS"
long_description = "Native local-first cybOS combining RobotCYB, CicadaFarm, CybChat, Brain, Knowledge Graph and Assets."
